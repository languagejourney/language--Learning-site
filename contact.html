<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WBZH2BVR73"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-WBZH2BVR73');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا - Contact Us</title>
    
    <!-- استيراد الخطوط المعتمدة بالموقع -->
    <link href="https://fonts.googleapis.com/css2?family=Marhey:wght@400;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Amiri:ital@1&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fff0f5, #ffe4e9);
            font-family: 'Playfair Display', serif;
        }

        .container {
            width: 85%;
            max-width: 340px; 
            text-align: center;
            padding: 20px 15px;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Playfair Display', cursive, serif;
            font-style: italic;
            font-size: 2.2rem;
            color: #545454;
            margin-bottom: 10px;
            font-weight: 600;
        }

        p.desc {
            color: #545454;
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .contact-box {
            background-color: #ffffff;
            border: 1.5px solid #545454;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .contact-label {
            font-size: 0.85rem;
            color: #777;
            margin-bottom: 5px;
            display: block;
        }

        .contact-link {
            display: block;
            color: #000000;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            word-break: break-all;
        }

        .btn-telegram {
            background-color: #EF8BC8;
            color: #000000;
            display: block;
            width: 100%;
            padding: 12px 10px;
            margin-top: 15px;
            text-decoration: none;
            border-radius: 16px;
            font-weight: bold;
            border: 1.5px solid #545454;
            box-sizing: border-box;
            font-family: 'Playfair Display', cursive, serif;
            font-style: italic;
            font-size: 1rem;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            color: #545454;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            border-bottom: 1px solid #545454;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Contact Us</h1>
        <p class="desc">يسعدنا تواصلكم واستفساراتكم دائماً عبر البريد الإلكتروني أو التليجرام.</p>

        <!-- البريد الإلكتروني -->
        <div class="contact-box">
            <span class="contact-label">البريد الإلكتروني الرسمي:</span>
            <a href="mailto:contactwithtme@gmail.com" class="contact-link">contactwithtme@gmail.com</a>
        </div>

        <!-- رابط بوت التليجرام -->
        <a href="https://t.me/languagejourneybot" target="_blank" class="btn-telegram">التواصل عبر Telegram</a>

        <!-- زر العودة للصفحة الرئيسية -->
        <a href="index.html" class="back-btn">← العودة للرئيسية</a>
    </div>

</body>
</html>
