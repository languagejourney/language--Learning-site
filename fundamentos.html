<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القسم الأول: الأساسيات - تغريد علي</title>
    <style>
        /* إعدادات التصميم المتجاوب والثابتة للموقع */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #fff0f5, #ffe4e9);
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            padding: 20px;
        }

        /* تنسيق العنوان الرئيسي */
        h1 {
            font-family: 'Arial', sans-serif;
            font-size: 2.2rem;
            color: #333;
            margin-bottom: 30px;
            font-weight: bold;
        }

        /* تنسيق الأزرار (الدروس) */
        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            margin: 15px 0;
            background-color: #f8b4c4;
            color: #333;
            text-decoration: none;
            border-radius: 15px;
            font-weight: bold;
            border: 2px solid #333;
            transition: transform 0.2s, background-color 0.2s;
            box-sizing: border-box;
        }

        .btn:hover {
            transform: scale(1.02);
            background-color: #f595a8;
        }

        /* زر العودة لقسم الإسباني */
        .back-btn {
            margin-top: 30px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #f8b4c4;
            border: 2px solid #333;
            border-radius: 15px;
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }

        .back-btn:hover {
            background-color: #f595a8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>القسم الأول:<br>الأساسيات</h1>

        <!-- الدروس -->
        <a href="lesson1.html" class="btn">الدرس الأول: الأبجدية والنطق الصحيح</a>
        <a href="#" class="btn">الدرس الثاني (قريباً)</a>
        <a href="#" class="btn">الدرس الثالث (قريباً)</a>

        <!-- زر العودة -->
        <br>
        <a href="espanol.html" class="back-btn">⬅️ العودة لقسم الإسباني</a>
    </div>

</body>
</html>
