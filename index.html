<head>

    <meta charset="UTF-8">

    <title>My Language Journal</title>
    
    <!-- Google Fonts -->

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #fff0f5, #ffe4e9);
            font-family: 'Playfair Display', serif;
        }

        .main-content {
            width: 85%;
            max-width: 340px; 
            text-align: center;
            padding: 40px 15px 20px 15px;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Playfair Display', cursive, serif;
            font-style: italic;
            font-size: 2.2rem;
            color: #545454;
            margin-bottom: 5px;
            font-weight: 600;
        }

        p.subtitle {
            font-family: 'Amiri', serif;
            font-style: italic;
            color: #545454;
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 35px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 10px;
            margin-bottom: 22px;
            text-decoration: none;
            color: #000000;
            border-radius: 16px;
            border: 1.5px solid #545454;
            box-sizing: border-box;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 3px 6px rgba(0,0,0,0.03);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-english {
            background-color: #EF8BC8; 
            font-family: 'Playfair Display', cursive, serif;
            font-style: italic;
            font-size: 1.25rem;
            font-weight: bold;
        }

        .btn-espanol {
            background-color: #A9C2A6; 
            font-family: 'Playfair Display', cursive, serif;
            font-style: italic;
            font-size: 1.25rem;
            font-weight: bold;
        }

        /* تنسيق أسفل الصفحة (Footer) */
        footer {
            width: 100%;
            text-align: center;
            padding: 15px 10px 25px 10px;
            font-size: 0.85rem;
            box-sizing: border-box;
        }

        footer a {
            color: #545454;
            text-decoration: none;
            margin: 0 8px;
            font-family: 'Playfair Display', serif;
            font-size: 0.85rem;
            border-bottom: 1px dotted #545454;
        }

        footer span {
            color: #888;
        }
    </style>
</head>
<body>

    <div class="main-content">
        <h1>My language journal</h1>
        <p class="subtitle">مُلاﺣَﻈﺎتِي اﻟﻠُّﻐَﻮِﻳَّﺔُ</p>

        <a href="english.html" class="btn btn-english">English</a>
        <a href="espanol.html" class="btn btn-espanol">Español</a>
    </div>

    <!-- الفوتر الخاص بالروابط الرسمية لـ Google AdSense -->

        <span>|</span>
        <a href="terms.html">Terms & Conditions</a>
        <span>|</span>
        <a href="contact.html">Contact Us</a>
    </footer>

</body>
</html>
