<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغريد علي - رحلة التعلم</title>
    <style>
        /* إعدادات الشاشة الأساسية لمنع الفراغات والتحكم بالمساحة */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #fff0f5, #ffe4e9); /* خلفية وردية هادئة */
        }

        /* الحاوية الرئيسية للمحتوى */
        .container {
            width: 90%; /* ياخذ 90% من عرض الشاشة */
            max-width: 400px; /* تحديد عرض أقصى حتى ما يصير عريض زيادة بالشاشات الكبيرة */
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-family: 'cursive', sans-serif;
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 30px;
        }

        /* تنسيق الأزرار */
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background-color: #f8b4c4;
            color: #333;
            text-decoration: none;
            border-radius: 15px;
            font-weight: bold;
            border: 2px solid #333;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.02);
            background-color: #f595a8;
        }

        /* تنسيق الروابط السفلى (About, English, Español) */
        .nav-links {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
        }

        .nav-links a {
            flex: 1;
            padding: 10px;
            background-color: #f8b4c4;
            border: 1px solid #333;
            border-radius: 10px;
            color: #333;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .footer-name {
            margin-top: 30px;
            font-family: 'cursive', sans-serif;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome</h1>

        <a href="#" class="btn">My Language Journey</a>
        <a href="#" class="btn">اتعلم وأخطأ لكن أستمر</a>
        <a href="#" class="btn">تعلم بطريقتي! تجربة ممتعة!</a>

        <div class="nav-links">
            <a href="about.html">About</a>
            <a href="english.html">English</a>
            <a href="espanol.html">Español</a>
        </div>

        <div class="footer-name">By : Taghreed Ali</div>
    </div>

</body>
</html>
