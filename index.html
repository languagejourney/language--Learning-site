<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Language Journal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;700&display=swap');

        :root {
            --grey: #545454;
            --pink-dark: #F168BC;
            --pink-mid: #EF8BC8;
            --pink-light: #FDBBE3;
            --bg-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            /* خلفية بيضاء مع تأثير غيوم/ورود وردية خفيفة جداً */
            background-image: radial-gradient(circle at 15% 20%, var(--pink-light) 0%, transparent 25%),
                              radial-gradient(circle at 85% 80%, var(--pink-light) 0%, transparent 25%);
            /* الإطار الرصاصي المطلوب */
            border: 15px solid var(--grey);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            padding: 40px 0;
        }

        /* عنوان Welcome بالخط الجميل واللون الأسود */
        .welcome-title {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #000;
            text-shadow: 3px 3px 0px var(--pink-light);
            margin-bottom: 30px;
        }

        /* مربعات العبارات بالتدرجات الوردية والنص الأسود */
        .phrase-1 {
            background-color: var(--pink-dark);
            color: #000;
        }
        .phrase-2 {
            background-color: var(--pink-mid);
            color: #000;
        }
        .phrase-3 {
            background-color: var(--pink-light);
            color: #000;
        }

        .phrase-box {
            padding: 15px 30px;
            margin: 15px auto;
            border-radius: 25px;
            display: inline-block;
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* أزرار التنقل (Español, English, About) */
        .nav-buttons {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            background-color: var(--pink-light);
            border: 2px solid var(--grey);
            padding: 12px 25px;
            border-radius: 15px;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            font-weight: bold;
            color: var(--grey);
            text-decoration: none;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: var(--pink-mid);
            color: #000;
        }

        /* التوقيع في الأسفل بخط يدوي */
        .signature {
            margin-top: 60px;
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: #000;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- عنوان الموقع -->
    <div class="welcome-title">Welcome</div>
    
    <!-- العبارات المطلوبة بالتدريج -->
    <div>
        <div class="phrase-box phrase-1">My Language Journey</div><br>
        <div class="phrase-box phrase-2">اتعلم وأخطأ لكن أستمر</div><br>
        <div class="phrase-box phrase-3">تعلم بطريقتي! تجربة ممتعة!</div>
    </div>

    <!-- الخانات المطلوبة -->
    <div class="nav-buttons">
        <a href="espanol.html" class="btn">Español</a>
        <a href="english.html" class="btn">English</a>
        <a href="about.html" class="btn">About</a>
    </div>

    <!-- التوقيع -->
    <div class="signature">By : Tagreed Ali</div>

</div>

</body>
</html>
