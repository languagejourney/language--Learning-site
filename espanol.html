<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Español - تغريد علي</title>
    <style>
        /* نفس إعدادات الصفحة الرئيسية للثبات بالتصميم */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #fff0f5, #ffe4e9);
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            padding: 20px;
        }

        /* عنوان الصفحة */
        h1 {
            font-family: 'cursive', sans-serif;
            font-size: 3rem;
            color: #333;
            margin-bottom: 30px;
        }

        /* الأزرار الأساسية */
        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            margin: 15px 0;
            background-color: #f8b4c4;
            color: #333;
            text-decoration: none;
            border-radius: 15px;
            font-weight: bold;
            border: 2px solid #333;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.02);
            background-color: #f595a8;
        }

        /* زر العودة للرئيسية */
        .back-btn {
            margin-top: 30px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #f8b4c4;
            border: 2px solid #333;
            border-radius: 15px;
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Español</h1>

        <!-- الأقسام -->
        <a href="basic.html" class="btn">القسم الأول: الأساسيات</a>
        <a href="grammar.html" class="btn">القسم الثاني: قواعد</a>

        <!-- زر العودة -->
        <br>
        <a href="index.html" class="back-btn">🏠 العودة للرئيسية</a>
    </div>

</body>
</html>
