<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Español - My Language Journal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;700&display=swap');

        :root {
            --grey: #545454;
            --pink-dark: #F168BC;
            --pink-mid: #EF8BC8;
            --pink-light: #FDBBE3;
            --bg-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 15% 20%, var(--pink-light) 0%, transparent 25%),
                              radial-gradient(circle at 85% 80%, var(--pink-light) 0%, transparent 25%);
            border: 15px solid var(--grey);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            padding: 50px 0;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #000;
            margin-bottom: 40px;
        }

        .section-link {
            display: block;
            background-color: var(--pink-mid);
            color: #000;
            padding: 20px;
            margin: 20px auto;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.5rem;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: 0.2s;
            width: 80%;
        }

        .section-link:hover {
            background-color: var(--pink-dark);
        }

        .back-btn {
            display: inline-block;
            margin-top: 50px;
            background-color: var(--pink-light);
            border: 2px solid var(--grey);
            padding: 10px 25px;
            border-radius: 12px;
            color: var(--grey);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Español</h1>

    <!-- الضغط هنا ينقل لصفحة الأساسيات -->
    <a href="fundamentos.html" class="section-link">القسم الأول: الأساسيات</a>
    
    <!-- القسم الثاني -->
    <a href="#" class="section-link">القسم الثاني: قواعد</a>

    <div style="margin-top: 30px;">
        <a href="index.html" class="back-btn">العودة للرئيسية 🏠</a>
    </div>
</div>

</body>
</html>
